<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel i Browar Kociewski - Rezerwacja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <header class="bg-primary text-white text-center py-5 shadow-sm">
        <h1 class="display-4 fw-bold">Hotel i Browar Kociewski</h1>
        <p class="lead">Odpoczynek zaczyna się tutaj</p>
    </header>

    <main class="container my-5">
        <div class="row g-4">
            <div class="col-md-4">
                <h4 class="mb-3 text-primary fw-bold">KOLUMNA 1 - 4</h4>
                <p class="text-muted small">Poznaj nasz wyjątkowy obiekt położony w sercu Kociewia.</p>
                <img src="piwo.jpg" alt="Hotel Kociewski" class="img-fluid rounded shadow-sm mb-3">
                <button class="btn btn-primary w-100 py-2 fw-bold" type="button" disabled>
                    <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                    <span role="status">Wczytywanie galerii...</span>
                </button>
            </div>

            <div class="col-md-8">
                <h4 class="mb-3 text-primary fw-bold">KOLUMNA 2 - 8</h4>
                <p class="text-muted small">Skorzystaj z szybkiej wyszukiwarki pokoi, aby sprawdzić dostępność w wybranym terminie.</p>
                <div class="bg-dark text-white p-4 p-md-5 rounded shadow">
                    <h4 class="text-center text-warning mb-4 fw-light">Reservation Form</h4>
                    <form action="rezerwacje.html" method="GET">
                        <div class="row g-3 align-items-end">
                            <div class="col-md-3">
                                <label class="form-label text-uppercase text-secondary small fw-bold">Arrival (Przyjazd)</label>
                                <input type="date" class="form-control bg-dark text-white border-secondary" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label text-uppercase text-secondary small fw-bold">Departure (Wyjazd)</label>
                                <input type="date" class="form-control bg-dark text-white border-secondary" required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label text-uppercase text-secondary small fw-bold">Rooms</label>
                                <select class="form-select bg-dark text-white border-secondary">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label text-uppercase text-secondary small fw-bold">Adult</label>
                                <select class="form-select bg-dark text-white border-secondary">
                                    <option value="1">1</option>
                                    <option value="2" selected>2</option>
                                    <option value="3">3</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label text-uppercase text-secondary small fw-bold">Children</label>
                                <select class="form-select bg-dark text-white border-secondary">
                                    <option value="0" selected>0</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                </select>
                            </div>
                            <div class="col-12 mt-4 text-end">
                                <button type="submit" class="btn btn-warning px-4 fw-bold shadow-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search me-1" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/></svg>
                                    SEARCH
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-primary text-white text-center py-4 mt-auto">
        <div class="container">
            <h5 class="mb-0 fw-bold">STOPKA</h5>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
